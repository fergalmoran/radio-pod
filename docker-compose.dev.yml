# Dev overrides: run only `icecast`, `liquidsoap` and `mediamtx` alongside `bun run dev`
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up icecast liquidsoap mediamtx

services:
  liquidsoap:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEB_URL: http://host.docker.internal:3000
      ICECAST_HOST: host.docker.internal   # connect via host to avoid inter-container network issues
      ICECAST_PORT: "8001"                 # secondary port mapping that binds on all interfaces

  icecast:
    ports:
      - "8001:8000"   # second binding on all interfaces; Liquidsoap reaches Icecast via host at this port

  mediamtx:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # `bun run dev` runs on the host (not in this compose network) over HTTPS —
      # the vite dev server here has a real cert but only for radio-pod.dev.fergl.ie,
      # hence --no-check-certificate in mediamtx.yml's wget calls.
      WEBHOOK_BASE_URL: https://host.docker.internal:3000
      # Publish auth (see mediamtx.yml). Unlike WEBHOOK_BASE_URL above, this
      # uses the real radio-pod.dev.fergl.ie hostname rather than
      # host.docker.internal — the dev cert only covers *.dev.fergl.ie, and
      # that hostname resolves to the host from inside containers too, so no
      # --no-check-certificate-style exception is needed here.
      MTX_AUTHHTTPADDRESS: https://radio-pod.dev.fergl.ie:3000/api/live/auth?secret=${MEDIAMTX_WEBHOOK_SECRET}
      # MediaMTX's HLS server always sets a Secure/SameSite=None session cookie,
      # which browsers refuse to persist over plain HTTP. There's no reverse proxy
      # in front of mediamtx in dev (unlike prod), so mediamtx must terminate TLS
      # itself here using the same wildcard dev cert vite.config.ts uses.
      MTX_HLSENCRYPTION: "yes"
      MTX_HLSSERVERKEY: /etc/letsencrypt/live/dev.fergl.ie/privkey.pem
      MTX_HLSSERVERCERT: /etc/letsencrypt/live/dev.fergl.ie/fullchain.pem
    volumes:
      # live/*.pem are relative symlinks into ../../archive/ — mount the whole
      # tree, not just live/dev.fergl.ie, or the symlinks resolve to nothing.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      # Second binding on all interfaces (compose files concatenate `ports:`
      # lists rather than replacing them, so this must be a *different* host
      # port than the base file's 127.0.0.1:8888:8888 — same pattern as
      # icecast's 8001:8000 above). Lets the browser reach this via
      # radio-pod.dev.fergl.ie, matching the wildcard dev cert's hostname —
      # "localhost" isn't covered by *.dev.fergl.ie.
      - "8889:8888"
