services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: "1234"
      LIQUIDSOAP_AUDIO_DIR: /mnt/audio/shows
      VITE_STREAM_URL: /stream.mp3
    volumes:
      - /home/fergalm/working/media/audio/shows:/mnt/audio/shows:ro
      - /mnt/audio/MuziQ/House:/mnt/deadair:ro
    depends_on: [db, liquidsoap]

  liquidsoap:
    image: savonet/liquidsoap:v2.3.0
    restart: unless-stopped
    command: liquidsoap /etc/liquidsoap/radio.liq
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - /home/fergalm/working/media/audio/shows:/mnt/audio/shows:ro
      - /mnt/audio/MuziQ/House:/mnt/deadair:ro
    environment:
      WEB_URL: http://web:3000
    ports:
      - "127.0.0.1:1234:1234"
    depends_on: [icecast]

  icecast:
    image: infiniteproject/icecast
    restart: unless-stopped
    volumes:
      - ./icecast/icecast.xml:/etc/icecast.xml:ro
    ports:
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: radio-pod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hackme
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
