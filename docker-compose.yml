# Production compose — all services for VPS deployment.
#
# Required env vars (put in .env.production on the server, and run compose
# with `docker compose --env-file .env.production ...` so the ${...}
# substitutions below also resolve, not just the container envs):
#   DATABASE_URL
#   BETTER_AUTH_SECRET
#   BETTER_AUTH_URL
#   KACL_URL                  (e.g. http://kacl:8080)
#   KACL_WEBHOOK_SECRET
#   APP_PUBLIC_URL
#   MEDIAMTX_WEBHOOK_SECRET
#   KACL_CONTROL_API_KEY      (optional — see kacl service below)
#
# Media paths — set these to wherever your files live on the VPS, or leave
# the defaults and create the directories under /opt/surge-fm/media/:
#   MEDIA_SHOWS               path to show episode audio   (default: /opt/surge-fm/media/shows)
#   MEDIA_IMAGES              path to show artwork         (default: /opt/surge-fm/media/images)
#   MEDIA_DEADAIR              path to dead-air music       (default: /opt/surge-fm/media/deadair)
#   MEDIA_JINGLES             path to jingle files         (default: /opt/surge-fm/media/jingles)

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radio-pod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radio-pod"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Web app ───────────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/radio-pod/radio-pod:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      AUDIO_DIR: /mnt/shows
      IMAGE_DIR: /mnt/images
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:?MEDIAMTX_WEBHOOK_SECRET is required}
    volumes:
      - ${MEDIA_SHOWS:-/opt/surge-fm/media/shows}:/mnt/shows
      - ${MEDIA_IMAGES:-/opt/surge-fm/media/images}:/mnt/images
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      kacl:
        condition: service_started

  # ── kacl (playout automation, encoding, and streaming) ───────────────────────
  kacl:
    image: ghcr.io/radio-pod/kacl:${KACL_VERSION:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      Automation__DeadAirFolder: /app/media/dead-air
      Automation__JingleFolder: /app/media/jingles
      # Optional, not required — kacl allows unauthenticated control-API access
      # when this is unset (see Program.cs), and the control API isn't
      # publicly exposed anyway (127.0.0.1-bound port, reached internally by
      # `web` over the compose network). Set it for defense in depth if you
      # want, but don't block startup over it like DB_PASSWORD/MEDIAMTX_WEBHOOK_SECRET below.
      Automation__Api__ControlApiKey: ${KACL_CONTROL_API_KEY:-}
    volumes:
      # Same host paths (and same container path for shows) as the web
      # service mounts above — the app hands kacl absolute track paths under
      # /mnt/shows when it schedules a show, so kacl must see that directory
      # at the identical path.
      - ${MEDIA_SHOWS:-/opt/surge-fm/media/shows}:/mnt/shows:ro
      - ${MEDIA_DEADAIR:-/opt/surge-fm/media/deadair}:/app/media/dead-air:ro
      - ${MEDIA_JINGLES:-/opt/surge-fm/media/jingles}:/app/media/jingles:ro
      - kacl_data:/app/data
    ports:
      - "127.0.0.1:8080:8080"

  # ── MediaMTX (live video ingest) ─────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    environment:
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:?MEDIAMTX_WEBHOOK_SECRET is required}
      WEBHOOK_BASE_URL: http://web:3000
      # Publish auth (see mediamtx.yml) — not templated by MediaMTX itself like
      # runOn* commands are, so the full URL (incl. secret) is set per-environment
      # here rather than in the checked-in mediamtx.yml.
      MTX_AUTHHTTPADDRESS: http://web:3000/api/live/auth?secret=${MEDIAMTX_WEBHOOK_SECRET}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8888:8888"

volumes:
  postgres_data:
  kacl_data:
