logLevel: info

# Publish auth: only an explicitly-armed show (via the "Go Live" button,
# which sets liveStatus="starting") may publish — see /api/live/auth.
# authHTTPAddress itself is set per-environment via the MTX_AUTHHTTPADDRESS
# env var in docker-compose(.dev).yml, since (unlike runOn* commands above)
# this field does not support ${VAR} templating — verified against v1.19.2.
authMethod: http
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Not "lowLatency": that variant pins sessions with a Secure/SameSite=None
# cookie, which browsers refuse to persist over plain HTTP — breaks in dev
# where the HLS port isn't behind a TLS-terminating proxy.
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsAlwaysRemux: true

pathDefaults:
  runOnReady: >
    wget -qO- --no-check-certificate --timeout=5
    "$WEBHOOK_BASE_URL/api/live/webhook?event=ready&path=$MTX_PATH&secret=$MEDIAMTX_WEBHOOK_SECRET"
  runOnReadyRestart: false
  runOnNotReady: >
    wget -qO- --no-check-certificate --timeout=5
    "$WEBHOOK_BASE_URL/api/live/webhook?event=notready&path=$MTX_PATH&secret=$MEDIAMTX_WEBHOOK_SECRET"

paths:
  all_others: {}
